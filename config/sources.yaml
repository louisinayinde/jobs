# Doctolib expose AUSSI un board Ashby « doctolib » (126 offres, mis à jour
# le même jour). On ne garde que Greenhouse pour ne pas créer de doublons
# inter-sources — le dédup (Feature 3.3) travaille sur `ats:entreprise:id`
# et ne les rapprocherait pas.
- nom: "Doctolib"
  ats: greenhouse
  token: doctolib

