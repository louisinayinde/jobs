# sources.yaml — registre des entreprises à surveiller et de leur ATS.
#
# Chaque entrée a la forme :
#   - nom: <nom lisible de l'entreprise>
#     ats: <identifiant de l'adaptateur : greenhouse | lever | ashby | smartrecruiters | workable>
#     token: <identifiant du board côté ATS — dépend de la plateforme>
#       - greenhouse : le "board token" utilisé dans
#         boards-api.greenhouse.io/v1/boards/{token}/jobs
#       - lever      : le slug utilisé dans
#         api.lever.co/v0/postings/{token}
#       - ashby      : le nom du job board utilisé dans
#         api.ashbyhq.com/posting-api/job-board/{token}
#       - workable   : le slug utilisé dans
#         apply.workable.com/api/v3/accounts/{token}/jobs
#
# Une entrée sans `token` (ou avec un `ats` inconnu) est ignorée et
# journalisée par le Source Registry (voir Feature 2.1) — elle n'empêche
# pas le chargement des autres sources.
#
# ⚠️ Le token n'est PAS déductible du nom de l'entreprise : il se lit dans
# l'URL du board public, et une entreprise change parfois d'ATS. Les 26
# tokens ci-dessous ont tous été vérifiés en direct le 2026-09-05
# (2 904 offres, dont 1 016 postes techniques). Si un endpoint se met à
# répondre 404, l'adaptateur le journalise sans casser le run — il faut
# alors ré-ouvrir la page carrière pour relire le slug.
#
# Voir docs/sources-audit.md pour l'audit complet des sources de
# website.md : ce qui est branché, ce qui reste à faire, ce qui est
# inaccessible et pourquoi.

