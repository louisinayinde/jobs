# filters.yaml — règles de rétention et de scoring appliquées aux offres
# collectées. Une offre qui ne passe pas la section `retention` est jetée
# avant tout stockage : elle n'est jamais publiée comme fiche sur le
# tableau GitHub Projects (voir "Retention Filter" dans l'architecture).

# Nombre de jours au-delà duquel une fiche "Nouveau" (jamais retenue par
# le candidat) est purgée du tableau par le Board Janitor (cron quotidien).
# Optionnel — défaut : 7.
retention_days: 7

retention:
  # Une offre est retenue si son titre contient AU MOINS un de ces termes
  # (comparaison insensible à la casse, sous-chaîne). Liste vide ou absente
  # = aucun filtre d'inclusion par titre (tout titre passe cette étape).
  title_include:
    - "software engineer"
    - "backend engineer"
    - "developer"

  # Une offre dont le titre contient un de ces termes est rejetée, même si
  # elle correspond à `title_include`. Prioritaire sur `title_include`.
  title_exclude:
    - "sales engineer"
    - "engineering manager"
    - "support engineer"

  seniority:
    # Profil visé : 1 à 3 ans d'expérience. Junior et mid sont la cible,
    # senior reste atteignable.
    # Niveaux de séniorité à garder. Vide ou absent = tous les niveaux
    # sont acceptés à cette étape.
    keep:
      - "junior"
      - "mid"
      - "senior"
    # Niveaux à toujours rejeter, même s'ils figurent aussi dans `keep`.
    # `drop` est prioritaire : « Software Engineers (Senior, Staff,
    # Principal) » est rejetée pour « staff » malgré « Senior ».
    drop:
      - "intern"
      - "staff"
      - "principal"
      - "lead"
      - "manager"

  location:
    # Une offre est retenue si sa localisation correspond à au moins une
    # de ces valeurs (ex: "remote" pour le full-remote). Vide ou absent =
    # aucune contrainte de localisation.
    require_any:
      - "remote"

    # Zones géographiques acceptées pour une relocalisation, en plus du
    # remote pur. Utilisées aussi par le Scorer pour la priorité géo.
    relocation_regions:
      - "asia"
      - "europe"
      - "france"

  # Si non vide, l'offre doit mentionner au moins une de ces technologies
  # (titre ou description) pour être retenue. Vide ou absente = filtre
  # désactivé (no-op) : aucune offre n'est rejetée pour raison tech.
  tech_include_any: []

scoring:
  # Score attribué selon la zone géographique de l'offre retenue. Plus le
  # score est haut, plus l'offre est prioritaire dans le tri du tableau
  # (à score égal : la plus récente d'abord).
  #
  # - remote_global : offre en télétravail dont la localisation ne nomme
  #   AUCUN lieu (« Worldwide », « Anywhere in the World », vide). « Remote
  #   (US) » ou « Remote, Canada » nomment un lieu : elles n'y ont pas droit.
  # - toute autre clé est une zone, cherchée dans la localisation avec les
  #   mêmes pays et villes que `relocation_regions` ; le suffixe
  #   `_relocation` est ignoré (asia_relocation = zone asia). Une offre
  #   sur plusieurs zones prend le meilleur score.
  # - default : score plancher des offres qu'aucune catégorie ne décrit.
  #   Optionnel — défaut : 0.
  geo_priority:
    remote_global: 100
    asia_relocation: 80
    europe: 60
    france: 40
    default: 0

  # Bonus de stack, ajouté au score géo. Chaque techno citée dans l'offre
  # (titre ou description) rapporte les points de son groupe ; le total est
  # plafonné à `max`. Toutes les technos rapportent, de 10 (stack maîtrisée)
  # à 1 (stacks non souhaitées) : une offre « Java ou Node.js » reste donc
  # bien classée grâce à Node.js, et une offre 100 % Java gagne peu.
  # Les noms de groupe sont libres. Un alias vaut la techno (k8s = Kubernetes),
  # et une techno inconnue du détecteur y est ajoutée automatiquement.
  # Avec max: 40, une offre qui colle à la stack peut remonter de deux
  # crans géo (une offre Europe à 60 + 40 passe devant l'Asie à 80).
  tech_bonus:
    max: 40
    mastered:
      points: 10
      techs:
        - "python"
        - "typescript"
        - "node.js"
        - "next.js"
        - "docker"
        - "sql"
        - "nosql"
        - "terraform"
        - "aws"
        - "gcp"
        - "javascript"
        - "react"
        - "express"
    learning:
      points: 5
      techs:
        - "rust"
        - "go"
        - "nestjs"
        - "grpc"
        - "kafka"
        - "k8s"
        - "postgresql"
        - "mysql"
        - "mongodb"
        - "dynamodb"
        - "git"
        - "ci/cd"
    # Ni stack ni rejet : l'écosystème autour.
    neutral:
      points: 3
      techs:
        - "django"
        - "flask"
        - "fastapi"
        - "redis"
        - "bigquery"
        - "graphql"
        - "rest"
        - "rabbitmq"
        - "bash"
        - "linux"
        - "prometheus"
        - "grafana"
        - "vue"
        - "angular"
    unwanted:
      points: 1
      techs:
        - "java"
        - "kotlin"
        - "swift"
        - "ruby"
        - "php"
        - "scala"
        - "elixir"
        - "c++"
        - "c#"
        - "spring"
        - "rails"
        - "laravel"
        - "symfony"
        - "svelte"
        - ".net"
        - "elasticsearch"
        - "cassandra"
        - "snowflake"
        - "spark"
        - "airflow"
        - "dbt"
        - "azure"
        - "ansible"
        - "helm"
        - "jenkins"
