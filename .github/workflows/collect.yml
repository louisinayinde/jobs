# Collecte normale — toutes les 15 minutes, soit 96 appels par jour.
#
# `--cadence fast` exclut les sources qui plafonnent leurs appels
# quotidiens ; celles-là sont collectées par `collect-slow.yml`. La
# répartition se déduit de `Adapter.max_calls_per_day`, donc aucune source
# ne peut se retrouver dans les deux workflows ni dans aucun.
#
# Le run mémorise les offres déjà vues dans `state/seen.json` (Feature 3.3)
# et publie les nouvelles sur le tableau de revue (Feature 4.3), en notant
# chaque fiche dans `state/fiches.json`. Le runner étant éphémère, ces
# fichiers sont **commités** à la fin du run : sans ce commit, chaque quart
# d'heure repartirait d'une mémoire vide, et le registre qui empêche les
# doublons sur le tableau serait perdu.

name: Collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Le même groupe que `collect-slow.yml` : les deux workflows écrivent
# `state/seen.json`, ils ne doivent jamais tourner en même temps. Sans
# annulation — un run lancé va au bout, sinon ses offres ne seraient pas
# mémorisées.
concurrency:
  group: collect-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      # Nécessaire au commit de `state/seen.json` ci-dessous.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # La pointe de la branche au démarrage du job, pas le commit de
          # l'événement : un run mis en attente derrière un autre doit
          # partir de la mémoire que ce dernier vient de pousser.
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: python -m src.collect --cadence fast
        env:
          # Le jeton personnel (scopes `repo` + `project`) : celui qu'Actions
          # fournit ne voit pas les Projects d'un compte. Le code lit
          # `GITHUB_TOKEN` ; un secret ne peut pas porter ce nom, d'où le lien
          # ici. Mise en place : docs/github-projects.md.
          GITHUB_TOKEN: ${{ secrets.JOBRADAR_TOKEN }}

      # `always()` : le run publie (Feature 4.3). Une publication interrompue
      # fait échouer le run **après** avoir écrit les fiches créées dans
      # `state/fiches.json` et les offres traitées dans `seen.json` ; perdre ce
      # registre, c'est risquer de republier ces offres en double.
      - name: Commit la mémoire des offres vues et le registre des fiches
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          # Aucune offre nouvelle : rien n'a bougé, pas de commit vide.
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): offres vues et fiches publiées [skip ci]"
          git pull --rebase --autostash
          git push
