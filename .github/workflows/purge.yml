name: Purge

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: python -m src.purge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
