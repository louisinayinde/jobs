# Collecte à cadence réduite — 4 fois par jour, pas 96.
#
# Certaines plateformes plafonnent leurs appels quotidiens : Remotive en
# autorise 4 (ses offres sont de toute façon retardées de 24 h). Les laisser
# dans `collect.yml`, planifié toutes les 15 minutes, reviendrait à en faire
# 96 par jour et à se faire couper l'accès.
#
# C'est le planificateur qui garantit le compte, et non un compteur dans le
# code : le runner Actions est éphémère, il ne mémoriserait rien d'un run à
# l'autre. `--cadence slow` sélectionne exactement les sources concernées ;
# `collect.yml` prend le complément, sans recouvrement possible.
#
# La minute 7 plutôt que 0 : GitHub Actions retarde d'autant plus une tâche
# planifiée qu'elle tombe à une heure ronde, très demandée. Une tâche
# retardée reste dans le budget (Actions saute une occurrence, il n'en
# duplique jamais), mais autant éviter les retards.
#
# ⚠️ Un déclenchement manuel (`workflow_dispatch`) s'ajoute à ces 4 appels.
#
# C'est aussi la cadence des sources lues par crawl de sitemap (Feature 2.5,
# aujourd'hui Japan Dev). Celles-là ont besoin de se souvenir d'où elles en
# étaient : le runner étant éphémère, l'état est **versionné dans le dépôt**
# (`state/crawl.json`) et remis en place à la fin de chaque run. Sans ce
# commit, chaque run repartirait de zéro et rechargerait le catalogue.
#
# Le même commit emporte `state/seen.json`, la mémoire des offres déjà vues
# (Feature 3.3), et `state/fiches.json`, le registre des fiches publiées sur
# le tableau (Feature 4.3), que `collect.yml` écrit aussi.

name: Collect (slow)

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

# Deux runs qui écriraient l'état en même temps se marcheraient dessus. Ils
# sont donc sérialisés, sans annulation : un run déjà lancé va au bout, sinon
# on perdrait les offres qu'il avait déjà collectées. Le groupe est partagé
# avec `collect.yml`, qui écrit lui aussi dans `state/`.
concurrency:
  group: collect-state
  cancel-in-progress: false

jobs:
  collect-slow:
    runs-on: ubuntu-latest
    permissions:
      # Nécessaire au commit de `state/` ci-dessous.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # La pointe de la branche, pas le commit de l'événement : un run
          # mis en attente derrière `collect.yml` doit partir de l'état que
          # celui-ci vient de pousser.
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: python -m src.collect --cadence slow
        env:
          # Le jeton personnel (scopes `repo` + `project`) : celui qu'Actions
          # fournit ne voit pas les Projects d'un compte. Le code lit
          # `GITHUB_TOKEN` ; un secret ne peut pas porter ce nom, d'où le lien
          # ici. Mise en place : docs/github-projects.md.
          GITHUB_TOKEN: ${{ secrets.JOBRADAR_TOKEN }}

      # `always()` : l'état gagné avant l'échec d'une source vaut d'être
      # gardé — le run suivant repartira de là plutôt que du début.
      - name: Commit l'état du crawl et des offres vues
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          # `git diff --cached --quiet` sort 0 quand rien n'a bougé : sans
          # changement on s'arrête là, plutôt que de créer un commit vide
          # toutes les six heures.
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): avancement du crawl, offres vues et fiches [skip ci]"
          # Un autre run a pu pousser entre-temps : on rejoue par-dessus
          # plutôt que d'écraser.
          git pull --rebase --autostash
          git push
