<script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Software Engineer - Clearing","image":"https://japan-dev.com/cdn/company_logos/auto/alpaca-z0Mz9uCr-20240717-024930.jpg","description":"\u003Cp>Note: While 100% remote, this position gives preference to candidates living near the Greater Tokyo area.\u003C/p>\r\n\u003Cp>&nbsp\u003C/p>\r\n\u003Cdiv class=\"content-intro\">\r\n  \u003Cdiv class=\"c-message_kit__blocks c-message_kit__blocks--rich_text\">\r\n    \u003Cdiv class=\"c-message__message_blocks c-message__message_blocks--rich_text\">\r\n      \u003Cdiv class=\"p-block_kit_renderer\">\r\n        \u003Cdiv class=\"p-block_kit_renderer__block_wrapper p-block_kit_renderer__block_wrapper--first\">\r\n          \u003Cdiv class=\"p-rich_text_block\">\r\n            \u003Cp class=\"p-rich_text_section\">\u003Cstrong>Who We Are:\u003C/strong>\u003C/p>\r\n            \u003Cp class=\"p-rich_text_section\">Alpaca is a fast-growing series B fintech company that’s raised over $120 million in funding.\u003Cbr>\r\n              Alpaca is an API-first stock and crypto platform that enables developers and businesses across the world to build trading algorithms, applications, and brokerage services.\u003Cbr>\r\n              Our globally distributed team consists of developers, traders, and brokerage specialists, and is backed by a group of prominent investors and highly experienced industry angel investors, including Portage Ventures, Spark Capital, Tribe Capital, Social Leverage, Horizons Ventures, Unbound, SBI Group, Eldridge, Positive Sum, Elefund, and Y Combinator.\u003C/p>\r\n            \u003Cp class=\"p-rich_text_section\">And, of course, we are very enthusiastic about open-source contributions as well as community building.\u003C/p>\r\n            \u003Cp class=\"p-rich_text_section\"> \u003C/p>\r\n            \u003Cp class=\"p-rich_text_section\">\u003Cstrong>The Alpaca Team:\u003C/strong>\u003C/p>\r\n            \u003Cp class=\"p-rich_text_section\">We have 150+ globally distributed (remote) team members who love to work from their favorite places in the world. We have team members based in the USA, Canada, Hungary, Japan, Brazil, Spain, Philippines, Nigeria, UK, and more! We love candidates who have a passion for making a global difference in financial services and technology, by impacting local communities and becoming a part of our hyper-growth company.\u003C/p>\r\n          \u003C/div>\r\n        \u003C/div>\r\n      \u003C/div>\r\n    \u003C/div>\r\n  \u003C/div>\r\n\u003C/div>\r\n\u003Cp> \u003C/p>\r\n\u003Cp>\u003Cstrong>Your Role:\u003C/strong>\u003C/p>\r\n\u003Cp>As a senior software engineer, you will help build and scale the systems and services that form the foundation of Alpaca and empower millions of users that are trading billions of dollars worth of assets.\u003C/p>\r\n\u003Cp>The clearing team is responsible for building a modern clearing and settlements platform. Alpaca is a participant in a market where over two trillion dollars worth of equities need to be cleared and settled on a daily basis. We are tackling the industry with a modern approach on building highly scalable, event driven systems where resilient engineering, scale, and performance can have critical advantages. \u003C/p>\r\n\u003Cp>We have exciting plans for the team; self-clearing is just the first step in building end-to-end financial infrastructure as we continue to prove ourselves as an innovative market leader and a core component for our growth across global markets and asset classes.\u003C/p>\r\n\u003Cp>We are looking for senior engineers who are keen on providing quality solutions, have great fundamentals, proven experience building and architecting at scale, and not afraid of challenging conventions or voicing their opinions. In this role, you will have the autonomy to design and implement solutions to achieve defined goals while actively participating in defining those goals. An understanding of cloud-based modern architecture, infrastructure, and orchestration practices are also great assets we actively look for.\u003C/p>\r\n\u003Cp> \u003C/p>\r\n\u003Cp>\u003Cstrong>Things You Get To Do:\u003C/strong>\u003C/p>\r\n\u003Cul>\r\n  \u003Cli>Contribute to a core system that millions of end users will rely on\u003C/li>\r\n  \u003Cli>Work on self-clearing and help us join the elite club of self-clearing brokers\u003C/li>\r\n  \u003Cli>Implement backend services and work on designing an architecture where reliability matters\u003C/li>\r\n  \u003Cli>Take ownership of tasks, identify and address technical challenges proactively, and propose innovative solutions\u003C/li>\r\n  \u003Cli>Contribute to architectural decisions, offering insights and suggestions for designing scalable and reliable systems\u003C/li>\r\n  \u003Cli>Work with other teams to improve how our systems interact with theirs and improve Alpaca systems in general\u003C/li>\r\n  \u003Cli>Maintain good software quality and test coverage\u003C/li>\r\n  \u003Cli>Participate in code reviews\u003C/li>\r\n  \u003Cli>Troubleshooting on incidents and reported bugs\u003C/li>\r\n  \u003Cli>You may be asked to be on-call to assist with engineering projects that are timely in nature\u003C/li>\r\n\u003C/ul>\r\n\u003Cp> \u003C/p>\r\n\u003Cp>\u003Cstrong>Who You Are (Must-Haves):\u003C/strong>\u003C/p>\r\n\u003Cul>\r\n  \u003Cli>Strong problem-solving skills paired with a proactive mindset\u003C/li>\r\n  \u003Cli>Excellent communication and collaboration skills\u003C/li>\r\n  \u003Cli>The ability to work independently and as part of a team\u003C/li>\r\n  \u003Cli>A preference for simple and elegant solutions\u003C/li>\r\n  \u003Cli>At least 3 years of experience working on systems at scale\u003C/li>\r\n  \u003Cli>Proven experience in building and maintaining microservices\u003C/li>\r\n  \u003Cli>Strong coding skills, preferably in Go\u003C/li>\r\n  \u003Cli>Ability to write clean, well-tested, and maintainable code\u003C/li>\r\n  \u003Cli>Experience with domain-driven design and event-driven design\u003C/li>\r\n  \u003Cli>Ability to debug issues or better yet, foresee problems and avoid them entirely\u003C/li>\r\n  \u003Cli>Familiarity with containerization and orchestration technologies, especially Kubernetes\u003C/li>\r\n  \u003Cli>Experience with cloud platforms, preferably Google Cloud Platform\u003C/li>\r\n  \u003Cli>Experience with messaging queues and message brokers\u003C/li>\r\n  \u003Cli>Experience with relational databases, preferably PostgreSQL\u003C/li>\r\n\u003C/ul>\r\n\u003Cp> \u003C/p>\r\n\u003Cp>\u003Cstrong>Who You Might Be\u003C/strong> (\u003Cstrong>Nice-to-Haves):  \u003C/strong>\u003C/p>\r\n\u003Cul>\r\n  \u003Cli>Previous experience in the financial industry or knowledge of clearing and settlement processes\u003C/li>\r\n  \u003Cli>Experience with DTCC integration\u003C/li>\r\n  \u003Cli>Experience working remotely\u003C/li>\r\n  \u003Cli>Experience working at a startup\u003C/li>\r\n  \u003Cli>DevOps mindset is an asset\u003C/li>\r\n\u003C/ul>\r\n\u003Cdiv class=\"content-conclusion\">\r\n  \u003Cp> \u003C/p>\r\n  \u003Cp>\u003Cstrong>How We Take Care of You:\u003C/strong>\u003C/p>\r\n  \u003Cul>\r\n    \u003Cli>Competitive Salary &amp; Stock Options\u003C/li>\r\n    \u003Cli>Benefits: Health benefits start on day 1. In the US this includes Medical, Dental, Vision. In Canada, this includes supplemental health care.  Internationally, this includes a stipend value to offset medical costs.   \u003C/li>\r\n    \u003Cli>New Hire Home-Office Setup: One-time USD $500\u003C/li>\r\n    \u003Cli>Monthly Stipend: USD $150 per month via a Brex Card\u003C/li>\r\n    \u003Cli>Work with awesome hard-working people, super smart and cool clients and innovative partners from around the world\u003C/li>\r\n  \u003C/ul>\r\n  \u003Cp>\u003Cem>Alpaca is proud to be an equal-opportunity workplace dedicated to pursuing and hiring a diverse workforce.\u003C/em>\u003C/p>\r\n\u003C/div>","datePosted":"2026-04-08","employmentType":"FULL_TIME","directApply":false,"occupationalCategory":"Engineering","url":"https://japan-dev.com/jobs/alpaca/alpaca-senior-software-engineer---clearing-qb5uw2","hiringOrganization":{"@type":"Organization","name":"Alpaca","sameAs":"https://alpaca.markets","logo":"https://japan-dev.com/cdn/company_logos/auto/alpaca-z0Mz9uCr-20240717-024930.jpg"},"validThrough":"2026-10-08","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Tokyo","addressRegion":"Tokyo","addressCountry":"JP"}},"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":[{"@type":"Country","name":"JP"}],"identifier":{"@type":"PropertyValue","name":"Alpaca","value":"alpaca-senior-software-engineer---clearing-qb5uw2"}}</script>
